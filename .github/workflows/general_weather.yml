name: Publish general weather forecast

on:
  # cron-job.org should call GitHub's workflow-dispatch API for this workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: general-weather-publisher
  cancel-in-progress: false

jobs:
  publish-general-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install publisher dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and publish general weather data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python publisher.py --general-weather-only
