name: Publish daily StormChase outlook

on:
  schedule:
    # GitHub cron uses UTC. These cover 00:00 Europe/Berlin in CET and CEST.
    # The publisher checks the local hour so only the matching UTC trigger runs.
    - cron: "0 23 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stormchase-daily-outlook
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Check out StormChase source modules
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STORMCHASE_SOURCE_REPOSITORY }}
          path: stormchase-source
          token: ${{ secrets.STORMCHASE_SOURCE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install publisher dependencies
        run: python -m pip install -r requirements.txt requests-cache

      - name: Fetch and store today's outlook
        env:
          PYTHONPATH: ${{ github.workspace }}/stormchase-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python daily_outlook_publisher.py
